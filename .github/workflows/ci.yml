name: ci
on:
  push:
  pull_request:
# The checks only read the repository.
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Rust toolchain
        run: rustup toolchain install
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy, all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Oracle comparisons
        run: cargo test --package ting-core --features oracle --locked
      - name: Release build agrees with the VM tests
        run: cargo test --release --package ting-core --test vm --locked
      - name: No WebAssembly crates in the consensus build
        shell: bash
        run: |
          if cargo tree --package ting-core --edges normal --locked | grep -Ei 'wasmi|wasmparser|wasm-encoder|wast'; then
            echo "a WebAssembly crate reached the consensus build" >&2
            exit 1
          fi
